name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ShellCheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: ShellCheck
        run: shellcheck -x deploy/*.sh deploy/lib/*.sh
      - name: Unit tests
        run: python -m unittest discover -s deploy/tests -v
